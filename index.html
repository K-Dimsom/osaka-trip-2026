var P={"DAYS":[{"id":"d1","label":"11/2 월","color":"#e74c3c","title":"11/2 (월) 도착일","sub":"진에어 LJ611 10:00 간사이 도착 → 난바 → 구로몬 → 신세카이 → 도톤보리 → 오렌 → 호텔. 2명 모두 백팩, 락커는 필요할 때만.","box":"기본은 백팩을 메고 이동하며 락커 비용은 0엔입니다. 어깨가 피곤하거나 쇼핑 짐이 늘면 난바 CITY 락커를 선택하고, 호텔로 가기 전에만 회수하세요.","items":[{"i":1,"id":"namba","t":"12:05","n":"난카이 난바역 도착 (백팩 이동, 락커 선택)","note":"진에어 LJ611 간사이 10:00 도착 기준 목표 시각. 입국·역 이동 여유를 두고 난카이로 이동해요. 둘 다 백팩만 메고 구로몬으로 갑니다.","shop":"namba","guide":"<b>공항 → 난바</b><br>① 간사이공항(Kansai Airport) 제1터미널에서 철도 표지판을 따라 <b>난카이 간사이공항역(Nankai Kansai-Airport Station / 南海 関西空港駅)</b>으로 이동<br>② <b>난바(Namba / 難波) 행 공항급행(Airport Express / 空港急行)</b> 승차 (환승 없음, 약 44분)<br>③ <b>요금 970엔</b> (종이표·IC 동일). 지정석 특급 <b>라피트β(Rapi:t β)</b>는 970엔 + 특급권 700엔 = 1,670엔 (1인 기준)<br>④ 승차권: 난카이 역 자동발매기(ticket machine)에서 목적지 「난바(Namba / 難波)」를 선택해 구입하거나 IC카드를 개찰구에 터치. 난카이 개찰구의 신용카드 터치 결제 가능 여부는 확인하지 못했어요.<br><br><b>선택: 난바 CITY 락커</b><br>백팩 여행은 보관 없이 진행합니다. 필요하면 본관 2층 중앙개찰구 앞 또는 JTB 안쪽 락커를 이용하세요. M 700엔, L 1,200엔, 일부 XL 1,500엔. 크기·결제 방식은 현장 표시 확인. 첫차~24:10 이용 가능. 2명이면 M 사이즈 1칸에 백팩 2개가 들어가는지 현장에서 확인. 위치와 번호를 촬영하고, 오렌 식사 후 호텔로 가기 전에 회수하세요.","ll":[34.6629331,135.5022953]},{"i":2,"id":"sanpei","t":"12:45","n":"구로몬 산페이 점심 (Kuromon Sanpei Lunch) + 구로몬시장 산책 (Kuromon Market)","note":"난바에서 백팩을 메고 걸어와요(약 13분). 식사 후 시장 산책은 약 45분 계획.","shop":"sanpei","guide":"","ll":[34.6660349,135.5070901]},{"i":3,"id":"tsuten","t":"14:40","n":"신세카이: 쿠시카츠·도테야키 (Shinsekai: Kushikatsu & Dotenyaki)","note":"잔잔 요코초(Janjan Yokocho)를 걷고 쿠시카츠(Kushikatsu)와 도테야키(Dotenyaki).","shop":"tsuten","guide":"","ll":[34.6524992,135.5063058]},{"i":4,"id":"doton","t":"17:15","n":"도톤보리·호젠지 요코초 산책 (Dotonbori & Hozenji Yokocho Walk)","note":"해 질 무렵 간판 불이 켜져요.","shop":"doton","guide":"","ll":[34.6687,135.5013]},{"i":5,"id":"oren","t":"19:00","n":"야키토리 오렌 (19:00, 2명 예약 필요)","note":"18:50까지 도착. 약 90분. 14석이라 2명 예약을 미리 해두세요.","shop":"oren","guide":"","ll":[34.6674176,135.5024967]},{"i":6,"id":"hotel","t":"21:15","n":"호텔 도착, 체크인 (Hotel Check-in, 15:00~)","note":"오렌에 function dnIs(s,d){var e=stGet(s,d);var l=locGet()['done|'+s+'|'+d];var sync=STATUS&&STATUS.doneSyncAt?new Date(STATUS.doneSyncAt).getTime():0;if(e&&e.status==='done'){if(l&&l.o.type==='undone'&&(!e.checkedAt||l.t>new Date(e.checkedAt).getTime()))return 'unpend';return 'done';}if(l&&l.o.type==='done'&&Date.now()-l.t<6*3600e3&&!(sync>l.t))return 'pend';return '';}
function dnUndo(s,d,msg){return relaySend({type:'undone',shop:s,date:d},'done|'+s+'|'+d,msg||'완료를 취소했어요. 이 가게는 계속 자동 확인합니다.');}
function dnBtn(it,d){if(!it.shop||!STATUS||!STATUS.shops||!STATUS.shops[it.shop])return '';var s=it.shop,dt=d.date,st=dnIs(s,dt);var A=function(cls,txt,fn){return '<a class="dn'+cls+'" href="javascript:void(0)" onclick="'+fn+'">'+txt+'</a>'};if(st==='done')return '<div>'+A(' on','완료됨',"return false")+A('','완료 취소',"return dnUndo('"+s+"','"+dt+"')")+'</div>';if(st==='pend')return '<div><span class="dn">완료 처리 요청 중</span>'+A('','잘못 눌렀어요 (취소)',"return dnUndo('"+s+"','"+dt+"','완료 요청을 취소했어요. 반영되지 않습니다.')")+'</div>';if(st==='unpend')return '<div><span class="dn">완료 취소 요청 중 (곧 반영)</span></div>';return '<div>'+A('','완료 (확인·예약 끝)',"if(!confirm('"+((P.INFO[s]||{}).ko||s).replace(/'/g,'')+" "+dt+" 를 완료 처리할까요? 이후 자동 확인에서 빠집니다.'))return false;return relaySend({type:'done',shop:'"+s+"',date:'"+dt+"'},'done|"+s+"|"+dt+"','완료 처리를 보냈어요. 잘못 눌렀다면 바로 [잘못 눌렀어요]를 누르세요.')")+'</div>';}
/* ===== 완료 취소 개선 끝 ===== */
var cur=0,map=null,S=null,sel=-1;
var tabsEl=document.getElementById('tabs'),mainEl=document.getElementById('main');
function setHH(){document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');}window.addEventListener('resize',function(){setHH();if(map)map.invalidateSize();});function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstChild;}
function gm(id){var c=P.COORDS[id];if(!c)return '#';return 'https://www.google.com/maps/search/?api=1&query='+c[0]+','+c[1];}
function gdir(l){var m=l.type==='sub'?'transit':'walking';return 'https://www.google.com/maps/dir/?api=1&origin='+l.aLL[0]+','+l.aLL[1]+'&destination='+l.bLL[0]+','+l.bLL[1]+'&travelmode='+m;}
function sn(it){var f=P.INFO[it.shop];var n=f?f.ko:it.n;return n.replace(/\(.*?\)/g,'').replace('Brackets Hotel Hommachi','호텔').trim();}
function shopTable(s){var rows=[['영업',s.hours],['휴무',s.closed],['결제',s.pay],['좌석',s.seat],['가격',s.price],['예약',s.res],['주소',s.addr]],h='<table>';rows.forEach(function(r){if(r[1]&&r[1]!=='-')h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';});return h+'</table>';}
function buildTabs(){tabsEl.innerHTML='';var all=[{label:'준비',color:'#555'}].concat(P.DAYS);all.forEach(function(d,i){var b=document.createElement('div');b.textContent=d.label;b.className=i===cur?'on':'';if(i===cur)b.style.background=d.color;b.onclick=function(){go(i)};tabsEl.appendChild(b);});}
function chkBox(rows,title){var K={'예약 완료':'k3','예약':'k1','예약 확인':'k1','영업 확인':'k2','당일':'k3','준비':'k4','확인':'k4','참고':'k4'};return '<div class="chk"><h4>'+title+'</h4>'+rows.map(function(r){return '<div class="r"><span class="chip '+(K[r[0]]||'k4')+'">'+r[0]+'</span><div><span class="when">'+r[1]+'</span>'+r[2]+'</div></div>';}).join('')+'</div>';}
function renderPrep(){
 var h='<div class="hero"><h2>출발 전 준비</h2><p>2인 · 진에어 · BRACKETS 싱글 2실 예약 완료</p></div>'+'<div class="box"><b>예약 완료 · 2026-10-20</b><br>진에어 LJ611/LJ616 2인 발권, BRACKETS 싱글룸 2실 결제 완료. 첫날 도착 10:00, 귀국 16:25 출발에 맞춰 시간을 조정했습니다. 일반 영업정보는 방문일 영업 확정이 아닙니다.</div>'+stSummary()+bkPrep()+chkBox(P.CHECKS.prep,'먼저 해야 할 것');
 h+='<h3>교통 이용 방법과 요금</h3><div class="how">'+P.TRANS+'</div><h3>폰에서 보는 방법</h3><div class="how">'+P.HOW+'</div>';
 h+='<h3>일본어 문장</h3>'+P.PHR.map(function(p){return '<div class="ph">'+p[0]+'<b>'+p[1]+'</b><div class="en">'+p[2]+'</div><div class="en">'+p[3]+'</div></div>';}).join('');
 h+='<h3>예산</h3><table class="t">'+P.BUDGET.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table><h3>전체 가게 정보</h3>';
 Object.keys(P.INFO).forEach(function(k){var s=P.INFO[k];if(!s.what)return;h+='<div class="sh"><b>'+s.ko+'</b> <span class="en">'+(s.jp?s.jp+' / ':'')+s.en+'</span><div class="what">'+s.what+'</div>'+(s.order&&s.order!=='-'?'<div class="order"><b>추천</b> '+s.order+'</div>':'')+(s.hours?shopTable(s):'')+'</div>';});
 mainEl.innerHTML=h;
}
function renderDay(d){
 var wm=0,wd=0;d.legs.forEach(function(l){if(l.type==='walk'){wm+=l.min;wd+=l.dist;}else{wm+=(l.wk||0);wd+=(l.wkd||0)*1000;}});
 var h=stSummary()+'<div class="hero"><h2 style="color:'+d.color+'">'+d.title+'</h2><p>'+d.sub+'</p><p class="sum">도보 합계 약 '+wm+'분 ('+(wd/1000).toFixed(1)+'km, 지하철 구간 내 도보 포함, 관광지 내부 산책 제외)</p></div>'+chkBox(P.CHECKS[d.id],'이 날 먼저 확인할 것');
 h+='<div class="stickybox" id="sb"><div class="segs" id="segs"><div class="seg on" data-k="-1" style="background:'+d.color+'"><b>전체 동선</b><small>모두 보기</small></div>'+d.legs.map(function(l,k){var a=d.items[k],b=d.items[k+1];return '<div class="seg" data-k="'+k+'"><b>'+l.ai+'→'+l.bi+'</b><small>'+(l.type==='sub'?'지하철':l.min+'분')+'</small></div>';}).join('')+'</div>';
 h+='<div class="seginfo"><span class="btn" id="ip">‹</span><span class="btn" id="in">›</span><div id="info"><span>구간을 누르면 지도와 아래 목록에서 그 구간이 선택돼요.</span></div><span class="btn" id="mt">지도 접기</span></div><div class="map" id="map"></div></div>';
 d.items.forEach(function(it,i){var s=P.INFO[it.shop]||{};
  h+='<div class="item" data-i="'+i+'" style="--c:'+d.color+'"><div class="top"><div class="num" style="background:'+d.color+'">'+it.i+'</div><div class="time">'+it.t+'</div><div style="flex:1;min-width:0"><div class="name">'+it.n+(s.pay==='현금만'?'<span class="tag">현금</span>':'')+stBadge(it,d)+'</div>'+stNote(it,d)+(s.en?'<div class="en">'+(s.jp&&s.jp!==s.ko?s.jp+' · ':'')+s.en+'</div>':'')+(it.note?'<div class="note">'+it.note+'</div>':'')+(s.what?'<div class="what">'+s.what+'</div>':'')+(s.order&&s.order!=='-'?'<div class="order"><b>추천 메뉴</b> '+s.order+'</div>':'')+(s.tip?'<div class="tip">'+s.tip+'</div>':'')+'<a class="btn" href="'+gm(it.id)+'" target="_blank">지도 열기</a>'+(s.hours?'<details><summary class="btn">영업·결제 정보</summary>'+shopTable(s)+'</details>':'')+(it.guide?'<div class="guide">'+it.guide+'</div>':'')+'</div></div></div>';
  var l=d.legs[i];if(l){h+='<div class="leg'+(l.type==='sub'?' sub':'')+'" data-k="'+i+'" style="--c:'+d.color+'"><b>'+(l.type==='sub'?l.title+' · '+l.fare:'도보 '+l.min+'분 · '+(l.dist/1000).toFixed(1)+'km')+'</b>'+(l.alt?'<div class="alt">'+l.alt+'</div>':'')+(l.guide?'<div class="guide">'+l.guide+'</div>':'')+'<a class="btn" href="'+gdir(l)+'" target="_blank">구글맵 길안내</a></div>';}
 });
 if(d.box)h+='<div class="box">'+d.box+'</div>';
 h+='<p class="en">지도 점선은 위치 연결선이며 실제 도로·철도 경로가 아닙니다. 길안내 버튼에서 현행 경로 확인. 시간·거리는 계획용 추정입니다.</p>'; h+='<div class="pn">'+(cur>0?'<button id="pv">이전</button>':'')+(cur<P.DAYS.length?'<button id="nx">다음</button>':'')+'</div>';
 mainEl.innerHTML=h;
 var pv=document.getElementById('pv'),nx=document.getElementById('nx');if(pv)pv.onclick=function(){go(cur-1)};if(nx)nx.onclick=function(){go(cur+1)};
 initMap(d);
}
function initMap(d){
 sel=-1;var box=document.getElementById('map');
 map=L.map(box,{tap:true});
 L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地図: 国土地理院'}).addTo(map);
 var lines=d.legs.map(function(l,k){var pl=L.polyline(l.pts,{color:d.color,weight:l.type==='sub'?3:5,opacity:.9,dashArray:(l.type==='sub'||l.approx)?'8 8':null});var mid=l.pts[Math.floor(l.pts.length/2)];var txt=l.type==='sub'?('약 '+l.min+'분'):l.min+'분';var tl=L.marker(mid,{interactive:false,icon:L.divIcon({className:'',html:'<div class="tl" style="border-color:'+d.color+';color:'+d.color+'">'+txt+'</div>',iconSize:[0,0],iconAnchor:[-4,10]})});pl.on('click',function(){setSel(k)});return L.layerGroup([pl,tl]);});
 var byLL={};d.items.forEach(function(it){var k=it.ll.join(',');(byLL[k]=byLL[k]||{it:it,n:[]}).n.push(it.i);});
 var mk={};Object.keys(byLL).forEach(function(k){var o=byLL[k];var t=o.n.join('·');var w=Math.max(26,12+t.length*8);mk[k]=L.marker(o.it.ll,{icon:L.divIcon({className:'',html:'<div style="background:'+d.color+';color:#fff;border:2px solid #fff;border-radius:12px;width:'+w+'px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)">'+t+'</div>',iconSize:[w,24],iconAnchor:[w/2,12]})}).bindTooltip(sn(o.it),{permanent:window.innerWidth>=600,direction:'right',offset:[12,0]});});
 var allPts=[];d.legs.forEach(function(l){l.pts.forEach(function(p){allPts.push(p)})});
 var btn=document.createElement('div');btn.className='fsbtn';btn.textContent='크게 보기';btn.onclick=function(e){e.stopPropagation();box.classList.toggle('full');document.body.classList.toggle('fs',box.classList.contains('full'));btn.textContent=box.classList.contains('full')?'닫기':'크게 보기';setTimeout(function(){map.invalidateSize();fit()},60);};box.appendChild(btn);
 function fit(){var pts=sel<0?allPts:d.legs[sel].pts;map.fitBounds(pts,{padding:[60,60],maxZoom:15});}
 function clear(){lines.forEach(function(g){map.removeLayer(g)});Object.keys(mk).forEach(function(k){map.removeLayer(mk[k])});}
 S={d:d,lines:lines,mk:mk,fit:fit,clear:clear};
 document.querySelectorAll('#segs .seg').forEach(function(e){e.onclick=function(){setSel(+e.getAttribute('data-k'))}});
 document.querySelectorAll('.leg').forEach(function(e){e.onclick=function(ev){if(ev.target.tagName==='A')return;setSel(+e.getAttribute('data-k'),true)}});
 document.querySelectorAll('.item').forEach(function(e){e.onclick=function(ev){if(ev.target.tagName==='A'||ev.target.tagName==='SUMMARY')return;var i=+e.getAttribute('data-i');setSel(i>0?i-1:0,true)}});
 document.getElementById('ip').onclick=function(){var n=S.d.legs.length;setSel(sel<0?n-1:sel-1)};document.getElementById('in').onclick=function(){var n=S.d.legs.length;setSel(sel>=n-1?-1:sel+1)};var mt=document.getElementById('mt');mt.onclick=function(){var sb=document.getElementById('sb');sb.classList.toggle('mapoff');mt.textContent=sb.classList.contains('mapoff')?'지도 펼치기':'지도 접기';setTimeout(function(){map.invalidateSize();S.fit();},60);};
 setSel(-1,true);
}
function setSel(k,noScroll){
 sel=k;var d=S.d;S.clear();
 if(k<0){S.lines.forEach(function(g){g.addTo(map)});Object.keys(S.mk).forEach(function(x){S.mk[x].addTo(map)});}
 else{var l=d.legs[k];S.lines[k].addTo(map);S.mk[l.aLL.join(',')].addTo(map);S.mk[l.bLL.join(',')].addTo(map);}
 document.querySelectorAll('#segs .seg').forEach(function(e){var on=(+e.getAttribute('data-k'))===k;e.classList.toggle('on',on);e.style.background=on?d.color:'#fff';});
 document.querySelectorAll('.leg').forEach(function(e){var on=(+e.getAttribute('data-k'))===k;e.classList.toggle('sel',on);e.style.background=on?d.color:'#fcfcfc';});
 document.querySelectorAll('.item').forEach(function(e){var i=+e.getAttribute('data-i');var on=k>=0&&(i===k||i===k+1);e.classList.toggle('sel',on);e.style.background=on?d.color+'22':'#fff';e.style.borderLeftColor=on?d.color:'#e6e2d8';});
 var info=document.getElementById('info');
 if(k<0){info.innerHTML='<span>전체 동선 · 구간을 누르면 지도와 목록에서 선택돼요</span>';}
 else{var l=d.legs[k];info.innerHTML='<span><b>'+l.ai+'→'+l.bi+' '+sn(d.items[k])+' → '+sn(d.items[k+1])+'</b> · '+(l.type==='sub'?l.title+' · '+l.fare:'도보 '+l.min+'분 · '+(l.dist/1000).toFixed(1)+'km')+'</span><a class="btn" href="'+gdir(l)+'" target="_blank">길안내</a>';
  }
 if(window.innerWidth<600){Object.keys(S.mk).forEach(function(x){S.mk[x].closeTooltip()});if(k>=0){var l2=d.legs[k];S.mk[l2.aLL.join(',')].openTooltip();S.mk[l2.bLL.join(',')].openTooltip();}}S.fit();if(!noScroll&&k>=0)scrollToItem(k);
}
function scrollToItem(k){var el=document.querySelector('.item[data-i="'+k+'"]');var sb=document.getElementById('sb');if(!el||!sb)return;var off=sb.getBoundingClientRect().bottom+8;window.scrollTo({top:window.scrollY+el.getBoundingClientRect().top-off,behavior:'smooth'});}
function go(){window._dnR=(window._dnR||0)+1;return go0.apply(this,arguments);}function go0(i){cur=Math.max(0,Math.min(P.DAYS.length,i));if(map){map.remove();map=null}buildTabs();setHH();if(cur===0)renderPrep();else renderDay(P.DAYS[cur-1]);try{history.replaceState(null,'','#'+(cur===0?'prep':P.DAYS[cur-1].id))}catch(e){}window.scrollTo(0,0);}
var st=['prep','d1','d2','d3','d4'].indexOf((location.hash||'').replace('#',''));go(st<0?0:st);loadStatus();dnLoad();
</script></body></html>
